<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phishing Detection Website</title>

  <style>
    
    :root {
      --bg: #f3f6fb;
      --card-bg: rgba(255, 255, 255, 0.9);
      --surface-strong: rgba(255, 255, 255, 0.72);
      --surface-soft: rgba(255, 255, 255, 0.42);
      --text-primary: #1f2937;
      --text-secondary: #5f6f86;
      --accent: #1a73e8;
      --accent-hover: #1558b0;
      --accent-soft: #e8f1ff;
      --border: rgba(31, 41, 55, 0.08);
      --safe: #1e8e3e;
      --danger: #d93025;
      --radius: 18px;
      --nav-bg: rgba(255, 255, 255, 0.84);
      --shadow: 0 8px 24px rgba(26, 115, 232, 0.08), 0 2px 10px rgba(15, 23, 42, 0.04);
      --input-bg: #f1f3f4;
      --timing: 0.35s ease;
      --chip-bg: #eef3ff;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: rgba(17, 24, 39, 0.9);
      --surface-strong: rgba(15, 23, 42, 0.82);
      --surface-soft: rgba(30, 41, 59, 0.8);
      --text-primary: #e5edf7;
      --text-secondary: #a8b7ca;
      --accent: #8ab4ff;
      --accent-hover: #669cff;
      --accent-soft: rgba(138, 180, 255, 0.14);
      --border: rgba(148, 163, 184, 0.12);
      --safe: #4ade80;
      --danger: #f87171;
      --nav-bg: rgba(15, 23, 42, 0.8);
      --input-bg: #1e293b;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.45);
      --chip-bg: rgba(138, 180, 255, 0.08);
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: "Google Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--timing), color var(--timing);
    }

    body {
      padding: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px 14px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-primary);
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #7cf0ad, #4db6ff);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 10px 18px rgba(77, 182, 255, 0.25);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--surface-strong);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 8px 12px;
    }
    .btn:hover { background: var(--card-bg); }

    .toggle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .toggle svg { width: 18px; height: 18px; stroke: var(--text-primary); }
    #themeLabel { display: none; }

    .hero {
      text-align: center;
      padding: 30px 20px 8px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      margin: 0;
      color: var(--text-primary);
    }
    .hero p {
      font-size: 1.22rem;
      line-height: 1.6;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .container {
      max-width: 930px;
      margin: 0 auto;
      padding: 8px 18px 42px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 18px 18px 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .info-box {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      min-height: 110px;
    }

    .info-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .info-copy {
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Headings inside cards */
    .muted {
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: block;
    }

    .input {
      display: flex;
      gap: 12px;
      position: relative;
      padding: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 17px;
      color: var(--text-primary);
      outline: none;
      min-height: 52px;
    }
    input[type="text"]:focus {
      box-shadow: none;
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), #5b9af8);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 18px rgba(26, 115, 232, 0.25);
      min-height: 52px;
    }
    .primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(26, 115, 232, 0.3);
    }
    .primary:active { transform: scale(0.98); }

    .model-select {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      min-height: 52px;
      font-size: 14px;
      outline: none;
    }

    .simple-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display:flex;
      flex-direction:column;
      gap:10px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .simple-list li {
      background: rgba(26,115,232,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    /* Tables */
    table.small { width: 100%; border-collapse: separate; border-spacing: 0; }
    table.small td {
      padding: 10px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    table.small tr:last-child td { border-bottom: none; }
    table.small td:first-child { color: var(--text-primary); font-weight: 500; }

    /* Perf Table (Bottom) */
    .perf-table { width: 100%; border-collapse: collapse; }
    .perf-table th { 
      text-align: left; 
      color: var(--text-secondary); 
      font-size: 12px; 
      padding-bottom: 8px; 
      border-bottom: 1px solid var(--border); 
    }
    .perf-table td { 
      padding: 12px 0; 
      font-size: 14px; 
      border-bottom: 1px solid var(--border);
    }
    .perf-table tr:last-child td { border-bottom: none; }

    /* Metrics & Bars */
    .metric { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .metric .label { font-size: 13px; color: var(--text-primary); font-weight: 500; }
    .metric .value { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    
    .bar {
      height: 6px;
      background: var(--input-bg);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 10px;
      background: var(--accent);
      transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Results Pill */
    #result { margin-top: 16px; min-height: 40px; display: flex; align-items: center; }
    .pill {
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .pill.safe { background: rgba(30, 142, 62, 0.12); color: var(--safe); }
    .pill.phish { background: rgba(217, 48, 37, 0.12); color: var(--danger); }

    /* Animations */
    .fade-in { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeUp { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .tiny { font-size: 11px; color: var(--text-secondary); margin-top: 8px; display: block; }
    code { font-family: "SF Mono", Menlo, monospace; font-size: 11px; background: var(--input-bg); padding: 2px 4px; border-radius: 6px; }

    .card .muted {
      letter-spacing: 0.08em;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 700;
    }

    table.small th, table.small td,
    .perf-table th, .perf-table td {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

  </style>
</head>
<body>

  <div class="brand-row fade-in">
    <div class="brand">
      <div class="logo">PD</div>
      <div class="title">PhishSieve</div>
    </div>
    <div class="nav-actions">
      <div class="toggle" title="Toggle theme" id="themeToggle">
        <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <span id="themeLabel"></span>
      </div>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <section class="hero fade-in" style="animation-delay: 0.1s;">
    <h1>Intelligent protection.</h1>
    <p>Real-time phishing detection for safer browsing.</p>
  </section>

  <div class="container">
    <main class="main" style="display:flex; flex-direction:column; gap:18px;">
      <div class="card live-card fade-in" style="animation-delay: 0.2s;">
        <span class="muted">Check a URL</span>
        <div class="input" style="margin-top:8px">
          <input id="url" type="text" value="http://google.com" placeholder="https://example.com">
          <button id="predict" class="primary">Predict</button>
        </div>
        <div id="result"></div>

        <div class="insights">
          <div class="info-box">
            <span class="info-label">Why this result</span>
            <div id="whyText" class="info-copy">Enter a URL and check whether it looks safe or risky.</div>
          </div>
          <div class="info-box">
            <span class="info-label">What to do next</span>
            <div id="nextText" class="info-copy">The app will guide you after the scan.</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Persist theme preference
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    
    function applyTheme(t){
      if(t === 'dark'){ 
        document.documentElement.setAttribute('data-theme','dark'); 
      } else { 
        document.documentElement.removeAttribute('data-theme'); 
      }
      localStorage.setItem('pd_theme', t);
    }
    const saved = localStorage.getItem('pd_theme') || 'light'; // Default to light for Apple look
    applyTheme(saved);
    
    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    document.getElementById('refreshBtn').addEventListener('click', loadMetrics);

    const $ = s=>document.querySelector(s);
    const urlInput = $('#url');
    const predictBtn = $('#predict');
    const resultDiv = $('#result');
    const whyText = $('#whyText');
    const nextText = $('#nextText');

    function pct(x){
      if(isNaN(x)) return '-';
      return (Math.round(x * 10000) / 100).toFixed(2) + '%';
    }

    // Modified Bar creation for Apple style
    function createBar(p){
      const wrapper = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'metric';
      meta.innerHTML = `<div class="label">${p.label}</div><div class="value">${p.valueText}</div>`;
      
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      
      // Use specific colors if provided, else variable
      if(p.color) fill.style.backgroundColor = p.color;
      
      bar.appendChild(fill);
      wrapper.appendChild(meta);
      wrapper.appendChild(bar);
      
      setTimeout(()=> { fill.style.width = p.valuePct + '%'; }, 100);
      return wrapper;
    }

    function getModelRationale() {
      return 'Random Forest is the active model for this app. It is the default choice and is used for every prediction.';
    }

    async function loadMetrics(){
      try {
        const r = await fetch('/metrics');
        const data = await r.json();
        if (data && data.accuracies) {
          // leave metrics endpoint loaded silently; UI intentionally does not display model-selection details
        }
      } catch(e) {
        console.error('metrics error', e);
      }
    }

    function setInsightState(label) {
      if (label === 'Safe') {
        whyText.textContent = 'This link looks normal and matches common safe website patterns.';
        nextText.textContent = 'You can continue, but still check the website address before entering personal details.';
        return;
      }

      whyText.textContent = 'This link shows signs commonly linked to phishing, such as suspicious structure or weak trust signals.';
      nextText.textContent = 'Do not click this link unless you verified it separately from a trusted source.';
    }

    async function predict(){
      resultDiv.innerHTML = '';
      
      const btn = document.getElementById('predict');
      btn.textContent = 'Analyzing...';

      try {
        const r = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ url: urlInput.value, model: 'Random Forest' })
        });
        const data = await r.json();
        
        btn.textContent = 'Predict';

        if(data.error){
          resultDiv.innerHTML = '<div class="tiny" style="color:var(--danger)">'+data.error+'</div>';
          whyText.textContent = 'The check could not run. Please try another URL.';
          nextText.textContent = 'Try a different web address and run the check again.';
          return;
        }

        const pill = document.createElement('span');
        pill.className = 'pill ' + (data.label === 'Safe' ? 'safe' : 'phish');
        pill.innerHTML = (data.label === 'Safe') 
          ? '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg> Safe' 
          : '<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg> Phishing Detected';
        
        resultDiv.appendChild(pill);
        setInsightState(data.label);
      } catch(e){
        console.error(e);
        btn.textContent = 'Predict';
        resultDiv.innerHTML = '<div class="tiny">Request failed</div>';
        whyText.textContent = 'The check failed to complete. Please try again.';
        nextText.textContent = 'Refresh the page or try a different URL.';
      }
    }

    loadMetrics();
    document.getElementById('predict').addEventListener('click', predict);
    urlInput.addEventListener('keydown', (e)=> { if(e.key === 'Enter') predict(); });
  </script>
</body>
</html>
